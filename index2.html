<body>
    <h1>Мини-викторина</h1>
    <p id="question"></p>
    <input id="answer" type="text" placeholder="Ваш ответ">
    <button onclick="next()">Ответить</button>
    <p id="result"></p>
    <script>
        let questions = [
            "3+3^0",
            "Столица  Якутии?",
            "страуцы умеют летать?",
            "сколько месяцев в году?",
            "люди умеют дышать под водой?",
            "в каком году изобрели первый самолет?",
            "D=(-4^2)-4*1*(-5)",
            "в каком году родился Энштейн?",
            "кто создал аниме Принцесса Мононокэ?",
            "Как зовут главного героя из мультфильма Город героев?",
            

        ]
        let answers = [
            "4",
            "Якутск",
            "нет",
            "12",
            "нет",
            "1903",
            "6^2",
            "1879",
            "Хаяо Миядзаки",
            "Хиро Хамада",
        ]
        let current = 0;
        let score = 0;
        document.getElementById("question").textContent = questions[current];
        function next(){
            let userAnswer = document.getElementById("answer").value;
            if (userAnswer.trim().toLowerCase() === answers[current].toLowerCase()){
                score++
            }
            current++;
            if(current >= questions.lenght){
                document.getElementById("question").textContent = "Викторина закончена";
                document.getElementById("result").textContent = "Ваш результат: " + score;
                document.getElementById("answer").style.display = "none";
                return;
            }
            document.getElementById("question").textContent = questions[current];
            document.getElementById("answer").value = "";
        }

    </script>
</body>
